name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test OidcServer.Tests/OidcServer.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Install Playwright browsers
        run: pwsh OidcServer.IntegrationTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Run integration tests
        run: dotnet test OidcServer.IntegrationTests/OidcServer.IntegrationTests.csproj --no-build --configuration Release --verbosity normal
